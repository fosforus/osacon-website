{{ $data := index .Site.Data }}

<section class="featured-projects">
  <h3 class="h4 prev-projects-header">Projects & Companies from Previous OSA Con Editions</h3>
<div class="logo-slider">
  <div class="slide-track">
    <!-- Repeat logo slides twice for seamless looping -->
    {{ with $data.projects }}
      {{ range .projects }}
        <img src="{{.image}}" alt="{{.name}}">
      {{ end }}
      {{ range .projects }}
        <img src="{{.image}}" alt="{{.name}}">
      {{ end }}
    {{ end }}
  </div>
</div>
</section>
