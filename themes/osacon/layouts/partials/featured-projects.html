{{ $data := index .Site.Data }}

<section class="featured-projects">
<div class="logo-slider">
  <div class="slide-track">
    <!-- Repeat your logo slides twice for seamless looping -->
    {{ with $data.projects }}
      {{ range .projects }}
        <div class="slide project-logo"><img src="{{.image}}" alt="{{.name}}"></div>
      {{ end }}
      {{ range .projects }}
        <div class="slide project-logo"><img src="{{.image}}" alt="{{.name}}"></div>
      {{ end }}
    {{ end }}
    <div class="slide"><img src="logo1.png" alt="Logo"></div>
    <div class="slide"><img src="logo2.png" alt="Logo"></div>
    <!-- ... more slides ... -->
    <div class="slide"><img src="logo1.png" alt="Logo"></div>
    <div class="slide"><img src="logo2.png" alt="Logo"></div>
  </div>
</div>
</section>
