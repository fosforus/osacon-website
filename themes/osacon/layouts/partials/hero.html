<section class="hero-alt">
  <div class="bg-video-container">
    <video class="bg-video" playsinline="" muted="" loop="" src="/images/homepage_bg_02.mp4" poster="/images/homepage_bg_02.mp4" autoplay=""></video>
    <div class="video-overlay"></div>
    <div class="hero-content">
      <div class="event-logo mb-4 mb-sm-1">
        <img src="/images/osacon2026-cubes.png" alt="OSA CON logo" class="img-fluid">      
      </div>
      <div class="event-meta mx-2 mx-md-0">
        <div style="display:inline-block;background-color:#0f3ad8;padding:0 5px;border-radius:4px;">Hybrid Event</div><br />
        <h1 style="text-wrap: balance;color:#fff">The Anti-Hype Conference for Open Source Analytics and AI</h1>
        <h3 class="mx-3 mx-sm-1 text-white">{{ .Site.Params.hero.text }}</h3>
        <button id="button-hero1" type="button" class="btn rounded my-2"><a target="_blank" href="{{ .Site.Params.registerURL }}">Pre-register for free</a></button>
        <button id="button-hero2" type="button" class="btn rounded btn-outline-primary my-2"><a target="_blank" href="{{ .Site.Params.subscribeURL }}">Sign up for updates</a></button>
        <div class="hero-meta">
          <div><div class="hero-icon"><i class="far fa-calendar"></i></i></div><div><h3>5+</h3>Years of Community</div></div>
          <div><div class="hero-icon"><i class="fa fa-users"></i></div><div><h3>5,000+</h3>Engineers & Analysts</div></div>
          <div><div class="hero-icon"><i class="fa fa-microphone"></i></div><div><h3>300+</h3>Technical Talks</div></div>
          <div><div class="hero-icon"><i class="fa fa-globe"></i></div><div><h3>45+</h3>Countries Represented</div></div>
        </div>

      </div>  
    </div>
  </div>
</section>
