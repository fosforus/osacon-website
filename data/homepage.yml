############################## Event ##############################
event_info:
  enable : true
  title : "What is OSA CON?"
  description : "OSA Con is a community-driven conference for engineers and architects building modern analytics and AI systems. Organized by the Open Source Analytics (OSA) community, the conference brings together practitioners, project maintainers, and data leaders to share real-world architectures, lessons from production systems, and updates from the open-source tools powering today’s analytics and AI platforms."
  cta_text: "Sign up for updates"
  cta_link: "/sing-up-for-updates"
  features: 
    - number : "2"
      label : "Days"

    - number : "Free!"
      label : "Free and online event"

    - number : "40+"
      label : "Sessions"

    - number : "2,500+"
      label : "participants"
  why_cards:
    - title: Learn from builders
      text: Hear from engineers building and running analytics platforms in production
      icon: icon-learn-blue-circle.svg
    - title: Discover the modern data stack
      text: Explore the technologies transforming data infrastructure - from ClickHouse® and Superset to Iceberg, Airflow, Kafka, and more.
      icon: icon-stack-blue-circle.svg
    - title: Meet the community
      text: Connect with maintainers, architects, engineering leaders, and contributors from around the world.
      icon: icon-users-blue-circle.svg
